<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MTG Arena Game Advisor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;--gold:#d4a843;--gold-dim:#8b7335;--white:#e8e8e8;--gray:#888;--red:#e74c3c;--green:#2ecc71;--blue:#3498db;--mana-w:#f9faf4;--mana-u:#0e68ab;--mana-b:#150b00;--mana-r:#d3202a;--mana-g:#00733e;--card-bg:#2a2a4a;--card-border:#444;--tapped:#555;--stack-bg:#3d1f00;--action-bg:#1a3a1a;--action-border:#4a8c4a}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--white);font-size:14px;overflow-x:hidden}
a{color:var(--gold)}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--gold-dim);position:sticky;top:0;z-index:10}
.header .match-info{font-size:13px;color:var(--gray)}
.header .match-info .players{color:var(--white);font-weight:600}
.header .match-info .turn-info{color:var(--gold);font-size:12px}
.conn-status{display:flex;align-items:center;gap:6px;font-size:12px}
.conn-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.conn-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green)}
.conn-dot.disconnected{background:var(--red);box-shadow:0 0 6px var(--red)}

/* Sections */
.section{padding:6px 10px}
.section-title{font-size:11px;text-transform:uppercase;color:var(--gold-dim);letter-spacing:1px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.section-title .count{color:var(--gray);font-size:10px}

/* Player bar */
.player-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);border-bottom:1px solid #333}
.player-bar.opponent{border-top:1px solid #333}
.player-name{font-size:14px;font-weight:600}
.life-total{font-size:32px;font-weight:700;color:var(--gold);min-width:50px;text-align:center;transition:all .3s}
.life-total.flash{animation:lifeFlash .5s ease}
@keyframes lifeFlash{0%{transform:scale(1.3);color:#fff}100%{transform:scale(1);color:var(--gold)}}
.player-stats{display:flex;gap:12px;font-size:12px;color:var(--gray)}
.player-stats span{display:flex;align-items:center;gap:3px}

/* Cards grid */
.cards{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:4px;padding:4px 7px;font-size:12px;line-height:1.3;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.card.creature .pt{color:var(--gold);font-weight:700;margin-left:4px}
.card.tapped{opacity:.5;border-color:var(--tapped);font-style:italic}
.card.tapped::before{content:"⟳ ";font-style:normal}
.card.land{background:#1a2a1a;border-color:#2a4a2a;font-size:11px}
.card.land.tapped{background:#1a1a1a}
.card.enchantment{border-color:#6a4a8a}
.card.artifact{border-color:#7a7a7a}

/* Hand cards - larger */
.hand-cards{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.hand-card{background:var(--card-bg);border:1px solid var(--gold-dim);border-radius:6px;padding:8px 10px;font-size:13px;min-width:120px;max-width:200px}
.hand-card .card-name{font-weight:600;margin-bottom:2px}
.hand-card .card-type{font-size:11px;color:var(--gray)}
.hand-card .mana-cost{font-size:11px;color:var(--blue);float:right;font-weight:600}

/* Stack */
.stack-section{background:var(--stack-bg);border:1px solid #5a3a1a;border-radius:4px;margin:4px 10px;padding:6px 10px}
.stack-item{padding:4px 0;border-bottom:1px solid #4a2a00;font-size:13px;font-weight:500}
.stack-item:last-child{border-bottom:none}
.stack-item .caster{color:var(--gray);font-size:11px}

/* Actions */
.actions-section{background:var(--action-bg);border:1px solid var(--action-border);border-radius:4px;margin:4px 10px;padding:6px 10px}
.action-item{padding:6px 8px;margin:3px 0;background:#2a4a2a;border:1px solid #5a8a5a;border-radius:4px;font-size:13px;cursor:default}
.action-item .action-type{font-size:10px;text-transform:uppercase;color:var(--green);margin-bottom:2px}

/* Advisor */
.advisor-section{background:linear-gradient(135deg,#2d2512,#1b2036);border:1px solid var(--gold);border-radius:6px;margin:8px 10px;padding:10px 12px;box-shadow:0 0 14px rgba(212,168,67,.15)}
.advisor-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.advisor-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:700}
.advisor-status{font-size:11px;color:var(--gray)}
.advisor-dismiss{background:#3a2f17;color:var(--gold);border:1px solid var(--gold-dim);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer}
.advisor-thinking{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:14px}
.advisor-thinking .mini-spinner{width:16px;height:16px;border:2px solid var(--gold-dim);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
.advisor-action-name{font-size:18px;font-weight:700;color:#fff;margin-bottom:5px}
.advisor-reasoning{color:#d8d1bd;line-height:1.35;margin-bottom:8px}
.advisor-alt-title{font-size:11px;text-transform:uppercase;color:var(--gold-dim);letter-spacing:1px;margin:8px 0 4px}
.advisor-alt{padding:5px 0;border-top:1px solid rgba(212,168,67,.18);font-size:12px;color:#d0d0d0}
.advisor-alt strong{color:var(--gold)}
.advisor-error{color:var(--red)}

/* Graveyard / Exile - collapsible */
.zone-toggle{cursor:pointer;user-select:none}
.zone-toggle::before{content:"▸ ";font-size:10px}
.zone-toggle.open::before{content:"▾ "}
.zone-content{display:none;padding:2px 0}
.zone-content.open{display:flex;flex-wrap:wrap;gap:3px}
.zone-card{font-size:11px;color:var(--gray);padding:2px 6px;background:#222;border-radius:3px}

/* Game log */
.log-section{background:#111;border-top:1px solid #333;max-height:200px;overflow-y:auto;padding:6px 10px;font-family:'SF Mono',Menlo,monospace;font-size:11px;line-height:1.5}
.log-entry{color:var(--gray);padding:1px 0}
.log-entry:last-child{color:var(--white)}

/* Waiting overlay */
.waiting{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px}
.waiting .spinner{width:40px;height:40px;border:3px solid var(--gold-dim);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.waiting .msg{color:var(--gray);font-size:16px}

/* Mobile tweaks */
@media(max-width:480px){.life-total{font-size:28px}.card{font-size:11px;padding:3px 5px}.hand-card{min-width:100px;padding:6px 8px;font-size:12px}.log-section{max-height:150px;font-size:10px}.header{padding:6px 8px}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="match-info">
      <div class="players" id="match-players">MTG Arena Advisor</div>
      <div class="turn-info" id="turn-info"></div>
    </div>
    <div class="conn-status">
      <span id="conn-label">Connecting...</span>
      <div class="conn-dot disconnected" id="conn-dot"></div>
    </div>
  </div>
  <div id="game-content">
    <div class="waiting" id="waiting-screen">
      <div class="spinner"></div>
      <div class="msg">Waiting for game...</div>
    </div>
  </div>
</div>
<script>
// --- State ---
let gameState = null;
let ws = null;
let reconnectDelay = 1000;
let prevLife = {};
let advisorState = { status: 'idle', decisionId: null, recommendation: null, error: '' };
let currentActionsKey = '';
let dismissedAdvisorDecisionId = null;

// --- WebSocket ---
function connect() {
  const url = 'ws://' + location.hostname + ':8766';
  ws = new WebSocket(url);
  ws.onopen = () => { setConnected(true); reconnectDelay = 1000; };
  ws.onclose = () => { setConnected(false); scheduleReconnect(); };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = (e) => handleSocketMessage(e.data);
}
function scheduleReconnect() { setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 1.5, 15000); }
function setConnected(ok) { const dot = document.getElementById('conn-dot'); const label = document.getElementById('conn-label'); dot.className = 'conn-dot ' + (ok ? 'connected' : 'disconnected'); label.textContent = ok ? 'Connected' : 'Disconnected'; }

function handleSocketMessage(raw) {
  try {
    const msg = JSON.parse(raw);
    if (msg.type === 'advisor') handleAdvisorMessage(msg);
    else { gameState = msg; handleStateActions(msg); }
    render();
  } catch(err) { console.error('Parse error', err); }
}

function handleAdvisorMessage(msg) {
  if (advisorState.decisionId && msg.decisionId && msg.decisionId < advisorState.decisionId) return;
  if (msg.decisionId && msg.decisionId !== advisorState.decisionId) dismissedAdvisorDecisionId = null;
  advisorState = {
    status: msg.status || 'idle',
    decisionId: msg.decisionId || advisorState.decisionId,
    recommendation: msg.recommendation || null,
    error: msg.error || ''
  };
}

function handleStateActions(s) {
  const actions = (s && s.actionsAvailable) || [];
  const nextKey = actionSignature(actions);
  if (nextKey && nextKey !== currentActionsKey) {
    currentActionsKey = nextKey;
    advisorState = { status: 'thinking', decisionId: advisorState.decisionId, recommendation: null, error: '' };
  } else if (!nextKey) {
    currentActionsKey = '';
  }
}

// --- Helpers ---
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function actionSignature(actions) { return (actions || []).map((a, i) => [a.actionIndex ?? i, a.actionType || '', a.name || ''].join(':')).join('|'); }
function actionNameForIndex(index) { const actions = (gameState && gameState.actionsAvailable) || []; const found = actions.find((a, i) => String(a.actionIndex ?? i) === String(index)); return found ? (found.name || found.actionType || `Action ${index}`) : `Action ${index}`; }
function dismissAdvisor() { dismissedAdvisorDecisionId = advisorState.decisionId || currentActionsKey || 'idle'; render(); }
function showAdvisor() { dismissedAdvisorDecisionId = null; render(); }
function cardClass(card) {
  const types = (card.cardTypes || []).map(t => t.toLowerCase());
  if (types.includes('creature')) return 'creature';
  if (types.includes('land')) return 'land';
  if (types.includes('enchantment')) return 'enchantment';
  if (types.includes('artifact')) return 'artifact';
  return '';
}

function renderBattlefieldCard(card) {
  const cls = ['card', cardClass(card), card.tapped ? 'tapped' : ''].filter(Boolean).join(' ');
  let inner = esc(card.name);
  if (card.power != null && card.toughness != null) {
    inner += `<span class="pt">${card.power}/${card.toughness}</span>`;
  }
  return `<div class="${cls}">${inner}</div>`;
}

function renderHandCard(card) {
  const mana = card.manaCost ? `<span class="mana-cost">${esc(card.manaCost)}</span>` : '';
  const types = (card.cardTypes || []).join(' · ');
  return `<div class="hand-card">${mana}<div class="card-name">${esc(card.name)}</div><div class="card-type">${esc(types)}</div></div>`;
}

function renderZone(title, cards, id) {
  if (!cards || cards.length === 0) return '';
  const cardHtml = cards.map(c => `<div class="zone-card">${esc(c.name || 'Unknown')}</div>`).join('');
  return `<div class="section"><div class="section-title zone-toggle" onclick="toggleZone('${id}')">${esc(title)} <span class="count">(${cards.length})</span></div><div class="zone-content" id="${id}">${cardHtml}</div></div>`;
}

function toggleZone(id) {
  const el = document.getElementById(id);
  const toggle = el.previousElementSibling;
  el.classList.toggle('open');
  toggle.classList.toggle('open');
}

function renderPlayerBar(player, isOpponent) {
  const name = esc(player.name || 'Unknown');
  const life = player.life != null ? player.life : '?';
  const key = isOpponent ? 'opp' : 'you';
  const flash = (prevLife[key] != null && prevLife[key] !== life) ? ' flash' : '';
  prevLife[key] = life;

  let stats = '';
  if (isOpponent) {
    stats = `<span>📚 ${player.libraryCount ?? '?'}</span><span>✋ ${player.handCount ?? '?'}</span>`;
  } else {
    stats = `<span>📚 ${player.libraryCount ?? '?'}</span>`;
  }

  return `<div class="player-bar${isOpponent ? ' opponent' : ''}">
    <div><div class="player-name">${name}</div><div class="player-stats">${stats}</div></div>
    <div class="life-total${flash}" id="life-${key}">${life}</div>
  </div>`;
}

function renderAdvisorPanel() {
  const decisionKey = advisorState.decisionId || currentActionsKey || 'idle';
  if (dismissedAdvisorDecisionId === decisionKey) {
    return `<div class="advisor-section"><div class="advisor-header"><div><div class="advisor-title">✨ Advisor</div><div class="advisor-status">Hidden for this decision</div></div><button class="advisor-dismiss" onclick="showAdvisor()">Show</button></div></div>`;
  }

  const button = advisorState.status !== 'idle' ? `<button class="advisor-dismiss" onclick="dismissAdvisor()">Hide</button>` : '';
  let body = `<div class="advisor-status">Waiting for the next decision point.</div>`;
  if (advisorState.status === 'thinking') {
    body = `<div class="advisor-thinking"><span class="mini-spinner"></span><span>Advisor thinking...</span></div>`;
  } else if (advisorState.status === 'ready' && advisorState.recommendation) {
    const r = advisorState.recommendation;
    const recName = r.recommended_action_name || actionNameForIndex(r.recommended_action);
    const alternatives = (r.alternatives || []).slice(0, 3).map(alt => `<div class="advisor-alt"><strong>${esc(alt.name || actionNameForIndex(alt.action))}</strong> — ${esc(alt.reasoning || '')}</div>`).join('');
    body = `<div class="advisor-action-name">${esc(recName)}</div><div class="advisor-reasoning">${esc(r.reasoning || '')}</div>${alternatives ? `<div class="advisor-alt-title">Alternatives</div>${alternatives}` : ''}`;
  } else if (advisorState.status === 'error') {
    body = `<div class="advisor-error">Advisor error: ${esc(advisorState.error || 'unknown error')}</div>`;
  }
  return `<div class="advisor-section"><div class="advisor-header"><div><div class="advisor-title">✨ Advisor</div><div class="advisor-status">${esc(advisorState.status)}</div></div>${button}</div>${body}</div>`;
}

// --- Main render ---
function render() {
  const s = gameState;
  if (!s || s.status !== 'in_game') {
    document.getElementById('game-content').innerHTML = `<div class="waiting"><div class="spinner"></div><div class="msg">${s && s.status ? esc(s.status) : 'Waiting for game...'}</div></div>${renderAdvisorPanel()}`;
    document.getElementById('match-players').textContent = 'MTG Arena Advisor';
    document.getElementById('turn-info').textContent = '';
    return;
  }

  // Header
  if (s.match && s.match.players) {
    const names = s.match.players.map(p => p.name).join(' vs ');
    document.getElementById('match-players').textContent = names;
  }
  if (s.turn) {
    const phase = s.turn.phase || '';
    const active = s.turn.activePlayer || '';
    document.getElementById('turn-info').textContent = `Turn ${s.turn.number || '?'} · ${phase} · ${active}'s turn`;
  }

  let html = '';

  // Opponent
  if (s.opponent) {
    html += renderPlayerBar(s.opponent, true);
    if (s.opponent.battlefield && s.opponent.battlefield.length > 0) {
      html += `<div class="section"><div class="section-title">Opponent's Battlefield <span class="count">(${s.opponent.battlefield.length})</span></div><div class="cards">${s.opponent.battlefield.map(renderBattlefieldCard).join('')}</div></div>`;
    }
    html += renderZone("Opponent's Graveyard", s.opponent.graveyard, 'opp-gy');
    html += renderZone("Opponent's Exile", s.opponent.exile, 'opp-ex');
  }

  // Stack
  if (s.stack && s.stack.length > 0) {
    html += `<div class="stack-section"><div class="section-title">⚡ Stack</div>`;
    s.stack.forEach(item => {
      html += `<div class="stack-item">${esc(item.name || 'Ability')}<span class="caster"> — ${esc(item.caster || '')}</span></div>`;
    });
    html += `</div>`;
  }

  // You
  if (s.you) {
    if (s.you.battlefield && s.you.battlefield.length > 0) {
      html += `<div class="section"><div class="section-title">Your Battlefield <span class="count">(${s.you.battlefield.length})</span></div><div class="cards">${s.you.battlefield.map(renderBattlefieldCard).join('')}</div></div>`;
    }
    html += renderPlayerBar(s.you, false);
    html += renderZone("Your Graveyard", s.you.graveyard, 'you-gy');
    html += renderZone("Your Exile", s.you.exile, 'you-ex');

    // Hand
    if (s.you.hand && s.you.hand.length > 0) {
      html += `<div class="section"><div class="section-title">Your Hand <span class="count">(${s.you.hand.length})</span></div><div class="hand-cards">${s.you.hand.map(renderHandCard).join('')}</div></div>`;
    }
  }

  // Actions
  if (s.actionsAvailable && s.actionsAvailable.length > 0) {
    html += `<div class="actions-section"><div class="section-title">🎯 Available Actions</div>`;
    s.actionsAvailable.forEach(a => {
      const label = a.name || a.actionType || 'Action';
      const type = a.actionType || '';
      html += `<div class="action-item"><div class="action-type">${esc(type)}</div>${esc(label)}</div>`;
    });
    html += `</div>`;
  }

  html += renderAdvisorPanel();

  // Log
  if (s.log && s.log.length > 0) {
    html += `<div class="log-section" id="game-log">`;
    s.log.forEach(entry => {
      const text = typeof entry === 'string' ? entry : (entry.text || JSON.stringify(entry));
      html += `<div class="log-entry">${esc(text)}</div>`;
    });
    html += `</div>`;
  }

  document.getElementById('game-content').innerHTML = html;

  // Auto-scroll log
  const logEl = document.getElementById('game-log');
  if (logEl) logEl.scrollTop = logEl.scrollHeight;

  // Re-trigger life flash animation
  ['you', 'opp'].forEach(key => {
    const el = document.getElementById('life-' + key);
    if (el && el.classList.contains('flash')) {
      void el.offsetWidth; // force reflow
    }
  });
}

// --- Init ---
connect();
</script>
</body>
</html>
